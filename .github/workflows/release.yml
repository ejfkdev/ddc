# Tag-triggered release: builds ddc for six targets (every platform
# cross-compiles on its family's runner — no Intel macOS runners), UPX-
# compresses where supported (everything but Mach-O), and uploads the RAW
# binaries — no zip/tar wrapping.
#
# The binary reports the tag's version: the workflow rewrites
# workspace.package.version (inherited by every crate, feeding
# CARGO_PKG_VERSION) from the tag name before building. Release artifacts
# ship stripped (CARGO_PROFILE_RELEASE_STRIP=symbols) even though the
# workspace profile keeps debug=true for local profiling.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  release:
    name: ddc ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            upx: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            upx: true
          # Fully static Linux builds for Alpine/musl distributions. Each
          # runner's host arch matches the target, so musl-gcc is native.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            upx: true
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            upx: true
            musl: true
          # Windows x64 + arm64 (arm64 cross on the x64 runner; UPX
          # best-effort — ARM64 PE support depends on the UPX build)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            upx: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            upx: true
          # macOS arm64 + amd64 (amd64 cross on the arm64 runner — the
          # last Intel runners queue for ages; UPX does not support
          # Mach-O, so both ship stripped, uncompressed)
          - os: macos-latest
            target: aarch64-apple-darwin
            upx: false
          - os: macos-latest
            target: x86_64-apple-darwin
            upx: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Strip the leading 'v': v1.2.3 → 1.2.3. The tag's annotated
      # message becomes the release description.
      - name: Tag → version
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          # %(contents:body) EXCLUDES the tag signature: committers with
          # tag.gpgsign=true (SSH) would otherwise leak the signature
          # block into the release description.
          TAG_SUBJECT=$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")
          TAG_BODY_ONLY=$(git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}")
          {
            echo "TAG_BODY<<EOF"
            echo "$TAG_SUBJECT"
            echo ""
            echo "$TAG_BODY_ONLY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # First `^version = "…"` in the root manifest is [workspace.package];
      # every crate inherits it, so CARGO_PKG_VERSION (binary --version and
      # the provenance header) follows the tag.
      - name: Stamp version
        shell: bash
        run: |
          python -c "
          import re
          s = open('Cargo.toml').read()
          s = re.sub(r'^version = \"[^\"]+\"', 'version = \"${VERSION}\"', s, count=1, flags=re.M)
          open('Cargo.toml', 'w').write(s)
          "
          grep -n '^version' Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.musl
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-tools

      # ${{ matrix.target }} expands in YAML, before any shell sees it —
      # no shell-variable semantics to get wrong across pwsh/bash.
      - name: Build (musl, fully static)
        if: matrix.musl
        # musl-gcc feeds both rustc's linker and every cc-rs / cmake C
        # dependency (zlib-ng, libdeflate, mimalloc). CMAKE_C_COMPILER is
        # required because libz-ng-sys drives cmake, which ignores CC.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CMAKE_C_COMPILER: musl-gcc
          CMAKE_C_FLAGS: -static
        # NOT --locked: the version-stamp step rewrites
        # workspace.package.version above, which invalidates Cargo.lock's
        # crate versions by design; the lock is still committed and used
        # as the resolution baseline.
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build
        if: matrix.musl != true
        # NOT --locked: the version-stamp step rewrites
        # workspace.package.version above, which invalidates Cargo.lock's
        # crate versions by design; the lock is still committed and used
        # as the resolution baseline.
        run: cargo build --release --target ${{ matrix.target }}

      - name: UPX-compress (linux/windows; best-effort)
        if: matrix.upx
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/ddc"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update -y && sudo apt-get install -y upx-ucl ;;
            Windows) choco install upx -y --no-progress ;;
          esac
          BEFORE=$(stat -c %s "$BIN" 2>/dev/null || wc -c < "$BIN")
          { upx --best --lzma "$BIN" || upx --best "$BIN"; } && upx -t "$BIN" \
            || echo "::warning::UPX unsupported for this binary — shipping uncompressed"
          AFTER=$(stat -c %s "$BIN" 2>/dev/null || wc -c < "$BIN")
          echo "upx: $BEFORE -> $AFTER bytes"

      - name: Verify binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/ddc"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
          if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then
            echo "(windows-arm64 binary cannot execute on the x64 runner — skipping run check)"
          else
            OUT="$("$BIN" --version)"
            echo "$OUT"
            case "$OUT" in *" $VERSION"*) ;; *) echo "::error::version mismatch: want $VERSION"; exit 1;; esac
          fi

      # Raw binaries as release assets — deliberately NOT zipped/tarballed.
      # Named with the FULL target triple (not a platform name): cargo-
      # binstall's {target} placeholder resolves its download URL from
      # exactly this form, per [package.metadata.binstall] in ddc-cli.
      - name: Stage binary asset
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/ddc"
          OUT="ddc-${{ env.TAG }}-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$BIN.exe" "$OUT.exe"
          else
            cp "$BIN" "$OUT"
            chmod +x "$OUT"
          fi
          ls -la "ddc-${{ env.TAG }}-${{ matrix.target }}"*

      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: ddc-${{ env.TAG }}-${{ matrix.target }}*
          body: ${{ env.TAG_BODY }}
          generate_release_notes: true
