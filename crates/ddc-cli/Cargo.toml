[package]
name = "ddc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ddc command-line interface"

[[bin]]
name = "ddc"
path = "src/main.rs"

# cargo-binstall: fetch the prebuilt release binary instead of compiling.
# binstall resolves this metadata from crates.io, then downloads the RAW
# (pkg-fmt = "bin") release asset named ddc-v{version}-{target}[.exe] —
# release.yml stages exactly that naming. {archive-suffix} is ".exe" on
# Windows and "" elsewhere, matching how the workflow stages assets.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ddc-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "bin"

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }

[dependencies]
libc = "0.2"  # SIGPIPE default disposition (pipe-aware CLIs)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP REST + MCP frontends: one definition, three interfaces
# (github.com/ejfkdev/xyz-rust, crates.io xyz-rust).
xyz-rust = "0.4.3"

ddc-dex = { workspace = true }
ddc-dec = { workspace = true }
anyhow = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }
memchr = "2"
memmap2 = "0.9"
mimalloc = "0.1.52"
